<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>عرض المذكرة - منصة علاء الدين</title>
    <style>
        body,
        html {
            margin: 0;
            padding: 0;
            height: 100%;
            background-color: #333;
            overflow: hidden;
        }

        #pdf-container {
            width: 100%;
            height: 100%;
            overflow: auto;
            text-align: center;
        }

        .pdf-page {
            margin: 10px auto;
            display: block;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.5);
            max-width: 100%;
        }

        #loading {
            color: white;
            font-family: 'Tajawal', sans-serif;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 24px;
            text-align: center;
        }

        .spinner {
            border: 4px solid rgba(255, 255, 255, 0.3);
            border-top: 4px solid white;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 10px auto;
        }

        @keyframes spin {
            0% {
                transform: rotate(0deg);
            }

            100% {
                transform: rotate(360deg);
            }
        }

        #header-controls {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            background: #222;
            color: #fff;
            padding: 10px;
            z-index: 1000;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.5);
            text-align: center;
            display: flex;
            justify-content: center;
            gap: 15px;
            align-items: center;
        }

        button {
            background: #4caf50;
            color: white;
            border: none;
            padding: 8px 15px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
        }

        button:hover {
            background: #388e3c;
        }

        #pdf-container-wrapper {
            margin-top: 50px;
            height: calc(100% - 50px);
            overflow: auto;
        }
    </style>
    <!-- PDF.js library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.11.338/pdf.min.js"></script>
</head>

<body>

    <div id="loading">
        <div class="spinner"></div>
        جاري تحميل الكتاب، يرجى الانتظار...
    </div>

    <div id="header-controls">
        <button id="zoom-out">تصغير</button>
        <button id="zoom-in">تكبير</button>
        <span id="page-count" style="font-family: Tajawal, sans-serif;"></span>
    </div>

    <div id="pdf-container-wrapper">
        <div id="pdf-container"></div>
    </div>

    <script>
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.11.338/pdf.worker.min.js';

        const params = new URLSearchParams(window.location.search);
        let url = params.get('file');

        if (!url) {
            document.getElementById('loading').innerText = 'لم يتم تحديد ملف';
        } else {
            // Remove f_auto or any transformations if they somehow exist without breaking the version
            url = url.replace(/\/upload\/(f_auto,q_auto|q_auto,f_auto|f_auto|q_auto)\//ig, '/upload/');

            let pdfDoc = null;
            let scale = 1.2;
            const container = document.getElementById('pdf-container');

            // Responsive scale based on screen width
            if (window.innerWidth < 600) scale = window.innerWidth / 600; // fit width approximately

            const renderPage = (num) => {
                return pdfDoc.getPage(num).then(page => {
                    const viewport = page.getViewport({ scale: scale });
                    const canvas = document.createElement('canvas');
                    canvas.className = 'pdf-page';
                    const ctx = canvas.getContext('2d');
                    canvas.height = viewport.height;
                    canvas.width = viewport.width;

                    const renderContext = {
                        canvasContext: ctx,
                        viewport: viewport
                    };

                    container.appendChild(canvas);
                    return page.render(renderContext).promise;
                });
            };

            const renderAllPages = async () => {
                for (let i = 1; i <= pdfDoc.numPages; i++) {
                    await renderPage(i);
                }
                document.getElementById('loading').style.display = 'none';
            };

            const loadPdf = () => {
                document.getElementById('loading').style.display = 'block';
                container.innerHTML = '';
                pdfjsLib.getDocument(url).promise.then(doc => {
                    pdfDoc = doc;
                    document.getElementById('page-count').innerText = `عدد الصفحات: ${doc.numPages}`;
                    renderAllPages();
                }).catch(err => {
                    console.error(err);
                    document.getElementById('loading').innerText = 'حدث خطأ أثناء تحميل الكتاب. يرجى التأكد من الرابط.';
                });
            };

            loadPdf();

            document.getElementById('zoom-in').addEventListener('click', () => {
                scale += 0.2;
                loadPdf();
            });

            document.getElementById('zoom-out').addEventListener('click', () => {
                if (scale > 0.4) {
                    scale -= 0.2;
                    loadPdf();
                }
            });
        }
    </script>
</body>

</html>
